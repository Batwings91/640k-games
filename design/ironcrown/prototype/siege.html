<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ironcrown — siege prototype</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
// Ironcrown siege prototype. Milestone 2 of design/ironcrown/05-roadmap.md.
// Proves: the catapult is fun and readable in plain Canvas at 320x200 with synth audio.
// Everything is placeholder art; the mechanics are what to judge.
'use strict';
const W=320,H=200;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;
const g=off.getContext('2d');g.imageSmoothingEnabled=false;

// ---- palette (VGA-flavoured, 24 entries) ----
const P={sky1:'#1a2a5c',sky2:'#5a78b8',sky3:'#a8c0e0',cloud:'#e8ecf4',
  grass1:'#3c6c2c',grass2:'#5c8c34',dirt:'#7c5c34',stone1:'#8c8c94',stone2:'#b4b4bc',stone3:'#5c5c64',
  crack:'#2c2c34',wood:'#8c5c2c',wood2:'#5c3c1c',rope:'#c8b070',rock:'#6c6c74',fire:'#f8a020',fire2:'#f84020',
  rot:'#78a838',ink:'#141018',paper:'#f0e0b8',gold:'#f0c040',red:'#c02020',white:'#ffffff',flag:'#2040c0'};

// ---- seeded rng (campaign will pass a seed; here it is the URL ?seed= or the clock) ----
let seed=(+new URLSearchParams(location.search).get('seed'))||(Date.now()&0xffff);const seed0=seed;
function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}

// ---- synth audio ----
let AC=null;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();}
function tone(f0,f1,dur,type,vol){if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,AC.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),AC.currentTime+dur);gn.gain.setValueAtTime(vol,AC.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);o.connect(gn).connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}
function noise(dur,vol,lp){if(!AC)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(rnd()*2-1);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const gn=AC.createGain();gn.gain.setValueAtTime(vol,AC.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);s.connect(f).connect(gn).connect(AC.destination);s.start();}
const sfx={
  tick:()=>tone(900,900,0.03,'square',0.05),
  launch:()=>{tone(120,40,0.25,'sawtooth',0.2);noise(0.3,0.15,1200);},
  crash:()=>{noise(0.5,0.4,600);tone(80,30,0.4,'square',0.2);},
  crack:()=>{noise(0.25,0.3,3000);tone(200,60,0.15,'square',0.15);},
  thud:()=>{noise(0.2,0.2,400);},
  fire:()=>{noise(0.8,0.25,2500);},
  rot:()=>{tone(300,80,0.5,'sine',0.2);},
  arrows:()=>{for(let i=0;i<3;i++)setTimeout(()=>tone(1800,600,0.08,'triangle',0.08),i*70);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,0.25,'square',0.12),i*140));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,f,0.35,'square',0.12),i*200));},
};

// ---- game state ----
const S={};
function reset(){
  S.phase='howto';        // howto | aim | power | flight | impact | volley | result
  S.angle=45;             // degrees
  S.power=0;S.powerDir=1; // 0..1 oscillating
  S.shots={boulder:6,fire:2,rot:2};S.type='boulder';
  S.soldiers=24;S.garrison=12;
  S.wind=Math.round((rnd()*2-1)*3); // -3..3
  S.suppressed=false;
  S.wall=[];const segs=5;for(let i=0;i<segs;i++)S.wall.push({hp:5,x:236+i*12,y:0});
  S.weak=Math.floor(rnd()*segs);
  S.proj=null;S.msg='';S.t=0;S.result=null;S.shake=0;S.parts=[];S.log=[];
}
reset();

// ---- input ----
const keys={};
function press(k){
  audio();
  if(S.phase==='howto'){S.phase='aim';return;}
  if(S.phase==='result'){if(k==='r'){reset();S.phase='aim';}return;}
  if(k==='1')S.type='boulder';if(k==='2'&&S.shots.fire>0)S.type='fire';if(k==='3'&&S.shots.rot>0)S.type='rot';
  if(k===' '||k==='Enter'){
    if(S.phase==='aim'){S.phase='power';S.power=0;S.powerDir=1;}
    else if(S.phase==='power')fireShot();
  }
}
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.key]=true;press(e.key);if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key]=false;});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(S.phase==='aim'&&y>H-22){ // shot buttons
    if(x<60)S.type='boulder';else if(x<120&&S.shots.fire>0)S.type='fire';else if(x<180&&S.shots.rot>0)S.type='rot';
    else press(' ');return;
  }
  press(' ');
});
// pointer drag aims (touch): vertical movement changes angle
let drag=null;
cv.addEventListener('pointermove',e=>{if(e.buttons&&S.phase==='aim'){const r=cv.getBoundingClientRect();const y=(e.clientY-r.top)/r.height*H;if(drag!==null)S.angle=clamp(S.angle+(drag-y)*0.5,20,75);drag=y;}else drag=null;});

function clamp(v,a,b){return v<a?a:v>b?b:v;}

// ---- mechanics ----
function fireShot(){
  const t=S.type;S.shots[t]--;
  S.phase='flight';
  const a=S.angle*Math.PI/180,sp=3.2+S.power*4.2;
  S.proj={x:52,y:H-38,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,type:t,trail:[]};
  sfx.launch();
  S.log.push(t+' at '+Math.round(S.angle)+'° power '+Math.round(S.power*100)+'%');
}
function wallTop(){return H-30-36;}
function impact(hitSeg,inside){
  const p=S.proj;S.phase='impact';S.timer=0;
  if(p.type==='boulder'){
    if(hitSeg!=null){const dmg=hitSeg===S.weak?3:1;S.wall[hitSeg].hp-=dmg;S.shake=6;sfx.crash();
      S.msg=hitSeg===S.weak?'The weak section gives! -3':'Stone chips. -1';
      burst(p.x,p.y,P.stone2,10);
      if(S.wall[hitSeg].hp<=0){S.msg='BREACH!';S.result='win';}
      else if(hitSeg===S.weak){S.weak=S.weak===0?1:S.weak===S.wall.length-1?S.weak-1:S.weak+(rnd()<0.5?-1:1);}
    }else if(inside){S.msg='Over the wall. The garrison scatters. -1 defender';S.garrison=Math.max(0,S.garrison-1);sfx.thud();burst(p.x,p.y,P.dirt,6);}
    else{S.msg='Short. The boulder rolls to a stop.';sfx.thud();burst(p.x,p.y,P.dirt,6);}
  }else if(p.type==='fire'){
    sfx.fire();burst(p.x,p.y,P.fire,14);
    if(hitSeg!=null||inside){S.suppressed=true;S.msg='Fire on the wall. No arrows next round.';if(inside)S.garrison=Math.max(0,S.garrison-1);}
    else S.msg='The fire pot smashes on the field.';
  }else{ // rot
    sfx.rot();burst(p.x,p.y,P.rot,12);
    if(inside){S.garrison=Math.max(0,S.garrison-3);S.msg='Rot in the courtyard. -3 defenders';}
    else if(hitSeg!=null){S.garrison=Math.max(0,S.garrison-1);S.msg='Rot splashes the wall. -1 defender';}
    else S.msg='Wasted. The rot never reaches them.';
  }
  S.proj=null;
}
function volley(){
  // defenders shoot back after each shot unless suppressed
  S.phase='volley';S.timer=0;
  if(S.suppressed){S.suppressed=false;S.vmsg='The defenders hide from the flames.';return;}
  if(S.garrison<=0){S.vmsg='No one is left to shoot.';return;}
  const lost=clamp(1+(S.garrison>=9?1:0)+(rnd()<0.3?1:0),1,3);
  S.soldiers=Math.max(0,S.soldiers-lost);S.vmsg='Arrows from the wall. -'+lost+' soldiers';sfx.arrows();
  burst(90+rnd()*40,H-34,P.red,4);
}
function endCheck(){
  if(S.result==='win'){S.phase='result';sfx.win();return true;}
  if(S.soldiers<=0){S.result='lose';S.msg='Your men break and run.';S.phase='result';sfx.lose();return true;}
  const left=S.shots.boulder+S.shots.fire+S.shots.rot;
  if(left<=0){S.result='lose';S.msg='Out of ammunition. The siege is lifted.';S.phase='result';sfx.lose();return true;}
  return false;
}
function burst(x,y,c,n){for(let i=0;i<n;i++)S.parts.push({x,y,vx:(rnd()-0.5)*3,vy:-rnd()*3,c,l:20+rnd()*20});}

// ---- update ----
function update(){
  if(S.phase==='aim'){
    if(keys.ArrowUp||keys.w)S.angle=clamp(S.angle+0.6,20,75);
    if(keys.ArrowDown||keys.s)S.angle=clamp(S.angle-0.6,20,75);
  }
  if(S.phase==='power'){
    S.power+=0.022*S.powerDir;if(S.power>=1){S.power=1;S.powerDir=-1;}if(S.power<=0){S.power=0;S.powerDir=1;}
    if(Math.round(S.power*100)%10===0)sfx.tick();
  }
  if(S.phase==='flight'){
    const p=S.proj;
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>40)p.trail.shift();
    p.vy+=0.11;p.vx+=S.wind*0.004;p.x+=p.vx;p.y+=p.vy;
    // wall collision
    const top=wallTop();
    let hit=null;
    S.wall.forEach((s,i)=>{if(s.hp>0&&p.x>=s.x&&p.x<s.x+12&&p.y>=top&&p.y<=H-30)hit=i;});
    if(hit!=null){impact(hit,false);return;}
    if(p.y>=H-30){impact(null,p.x>=S.wall[S.wall.length-1].x+12);return;}
    if(p.x>W+10)impact(null,true);
  }
  if(S.phase==='impact'){S.timer++;if(S.timer>70){if(!endCheck())volley();}}
  if(S.phase==='volley'){S.timer++;if(S.timer>70){if(!endCheck())S.phase='aim';S.wind=Math.round((rnd()*2-1)*3);}}
  S.parts.forEach(q=>{q.vy+=0.1;q.x+=q.vx;q.y+=q.vy;q.l--;});S.parts=S.parts.filter(q=>q.l>0&&q.y<H-28);
  if(S.shake>0)S.shake--;
}

// ---- drawing helpers ----
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
function dither(x,y,w,h,c1,c2,level){ // ordered 2x2 dither blend, level 0..4
  rect(x,y,w,h,c1);g.fillStyle=c2;const m=[[0,2],[3,1]];
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(m[yy&1][xx&1]<level)g.fillRect(xx,yy,1,1);
}
function text(s,x,y,c,align){g.font='8px monospace';g.textBaseline='top';g.textAlign=align||'left';if(c!==P.ink){g.fillStyle=P.ink;g.fillText(s,x+1,y+1);}g.fillStyle=c||P.paper;g.fillText(s,x,y);}
function box(x,y,w,h){rect(x,y,w,h,P.ink);rect(x+2,y+2,w-4,h-4,P.paper);rect(x+3,y+3,w-6,h-6,P.ink);rect(x+4,y+4,w-8,h-8,P.paper);}

function draw(){
  const sx=S.shake?Math.round((rnd()-0.5)*S.shake):0,sy=S.shake?Math.round((rnd()-0.5)*S.shake):0;
  g.save();g.translate(sx,sy);
  // sky in dithered bands
  const bands=[[P.sky1,P.sky2],[P.sky2,P.sky3]];
  rect(0,0,W,H,P.sky3);for(let i=0;i<14;i++){const b=i<7?bands[0]:bands[1];dither(-4,i*13-4,W+8,14,b[0],b[1],Math.floor((i%7)*4/6));}
  // clouds
  [[40,22],[150,14],[250,30]].forEach(([x,y],i)=>{const o=((S.t*0.1)+i*40)%400-40;rect(x+o*0.05,y,26,5,P.cloud);rect(x+o*0.05+6,y-3,14,3,P.cloud);});
  // ground
  dither(-4,H-30,W+8,34,P.grass1,P.grass2,2);rect(-4,H-30,W+8,1,P.grass2);
  // castle
  const top=wallTop();
  S.wall.forEach((s,i)=>{
    if(s.hp<=0){rect(s.x,H-36,12,6,P.stone3);for(let k=0;k<4;k++)rect(s.x+k*3,H-38-(k%2)*2,2,3,P.stone1);return;}
    dither(s.x,top,12,H-30-top,P.stone1,P.stone2,2);
    rect(s.x,top,12,1,P.stone3);for(let yy=top+4;yy<H-30;yy+=6)rect(s.x,yy,12,1,P.stone3);
    if(i%2===0){rect(s.x,top-4,3,4,P.stone1);rect(s.x+6,top-4,3,4,P.stone1);}
    // damage cracks
    for(let d=0;d<5-s.hp;d++){rect(s.x+1+d*2,top+6+(d%3)*9,1,8,P.crack);}
    // weak section tell: a visible fissure that glints
    if(i===S.weak){rect(s.x+5,top+6,1,H-30-top-10,P.crack);rect(s.x+6,top+12,1,6,P.crack);if((S.t>>3)&1)rect(s.x+4,top+9,1,2,P.white);}
  });
  // keep and flag behind wall
  rect(300,top-26,20,H-30-top+26,P.stone1);rect(300,top-26,20,1,P.stone3);rect(304,top-40,1,14,P.wood2);rect(305,top-40,10,6,P.flag);
  // defenders on wall
  if(S.garrison>0)for(let i=0;i<Math.min(5,Math.ceil(S.garrison/3));i++){const x=240+i*12;rect(x,top-6,3,6,S.suppressed?P.fire2:P.red);rect(x,top-8,3,2,P.paper);}
  // fire glow when suppressed
  if(S.suppressed)for(let i=0;i<6;i++)rect(236+rnd()*60,top-3-rnd()*6,2,2,(i&1)?P.fire:P.fire2);
  // your army
  for(let i=0;i<Math.ceil(S.soldiers/2);i++){const x=70+(i%8)*7,y=H-36+Math.floor(i/8)*3;rect(x,y-6,3,6,P.flag);rect(x,y-8,3,2,P.paper);}
  // catapult
  rect(36,H-36,24,4,P.wood);rect(40,H-40,2,4,P.wood2);rect(54,H-40,2,4,P.wood2);
  const a=S.angle*Math.PI/180,armL=18,ax=48,ay=H-38;
  const armA=S.phase==='power'||S.phase==='aim'?a+0.6:a-0.4;
  for(let i=0;i<armL;i++)rect(ax+Math.cos(armA)*i,ay-Math.sin(armA)*i,2,2,P.wood2);
  rect(ax+Math.cos(armA)*armL-1,ay-Math.sin(armA)*armL-1,4,3,P.rope);
  // aim arc (honest preview using the current power, or mid power while aiming)
  if(S.phase==='aim'||S.phase==='power'){
    const sp=3.2+(S.phase==='power'?S.power:0.5)*4.2;let x=52,y=H-38,vx=Math.cos(a)*sp,vy=-Math.sin(a)*sp;
    for(let i=0;i<90;i++){vy+=0.11;vx+=S.wind*0.004;x+=vx;y+=vy;if(y>H-30||x>W)break;if(i%3===0)rect(x,y,1,1,S.phase==='power'?P.gold:P.paper);}
  }
  // projectile
  if(S.proj){const p=S.proj;p.trail.forEach((t,i)=>{if(i%2)rect(t.x,t.y,1,1,P.stone3);});
    const c=p.type==='boulder'?P.rock:p.type==='fire'?P.fire:P.rot;rect(p.x-2,p.y-2,4,4,c);if(p.type==='fire')rect(p.x-1,p.y-4,2,2,P.fire2);}
  S.parts.forEach(q=>rect(q.x,q.y,1,1,q.c));
  g.restore();

  // HUD
  rect(0,0,W,12,P.ink);
  text('MEN '+S.soldiers,4,2,P.paper);text('GARRISON '+S.garrison,70,2,P.paper);
  text('WIND '+(S.wind===0?'calm':(S.wind>0?'→ ':'← ')+Math.abs(S.wind)),150,2,P.gold);
  text('ANGLE '+Math.round(S.angle)+'°',225,2,P.paper);
  const seedTxt='#'+seed0.toString(16);text(seedTxt,W-4,2,P.stone2,'right');
  // shot hand
  rect(0,H-22,W,22,P.ink);
  const hand=[['1 BOULDER',S.shots.boulder,'boulder'],['2 FIRE',S.shots.fire,'fire'],['3 ROT',S.shots.rot,'rot']];
  hand.forEach(([n,c,k],i)=>{const sel=S.type===k;rect(2+i*60,H-20,56,18,sel?P.paper:P.stone3);text(n,6+i*60,H-18,sel?P.ink:P.paper);text('x'+c,6+i*60,H-10,sel?P.ink:(c?P.paper:P.red));});
  if(S.phase==='aim')text('SPACE: wind up',186,H-14,P.gold);
  if(S.phase==='power'){text('SPACE: release',186,H-18,P.gold);rect(186,H-8,100,5,P.stone3);rect(186,H-8,100*S.power,5,S.power>0.8?P.red:P.gold);}
  if(S.phase==='impact')text(S.msg,W/2,H-16,P.gold,'center');
  if(S.phase==='volley')text(S.vmsg,W/2,H-16,P.red,'center');

  if(S.phase==='howto'){
    box(20,24,280,150);
    text('SIEGE OF THE HIGH KEEP',W/2,32,P.red,'center');
    const lines=['Breach the wall before your men run out.',
      '','UP/DOWN aims. The dotted arc is honest.','SPACE winds the power bar, SPACE again to loose.','Wind pushes the shot; watch the top bar.',
      '','The glinting fissure is the weak stone: 3 damage','instead of 1. It shifts after each hit.',
      '','1 BOULDER breaks wall.   2 FIRE stops the next volley.','3 ROT over the wall kills defenders.',
      '','Defenders shoot after every shot you make.','','SPACE to begin'];
    lines.forEach((l,i)=>text(l,W/2,46+i*8,i===lines.length-1?P.red:P.ink,'center'));
  }
  if(S.phase==='result'){
    box(40,50,240,100);
    const win=S.result==='win';
    text(win?'THE WALL IS BREACHED':'THE SIEGE FAILS',W/2,58,P.red,'center');
    text(S.msg,W/2,72,P.ink,'center');
    const shotsUsed=10-(S.shots.boulder+S.shots.fire+S.shots.rot);
    text('Shots: '+shotsUsed+'   Men left: '+S.soldiers+'   Garrison: '+S.garrison,W/2,88,P.ink,'center');
    if(win)text('Assault odds: '+S.soldiers+' vs '+S.garrison+(S.soldiers>S.garrison*1.5?'  (favourable)':S.soldiers>S.garrison?'  (close)':'  (grim)'),W/2,100,P.ink,'center');
    text('Seed '+seedTxt+'. R to try again.',W/2,122,P.ink,'center');
    text('Same seed = same wall and wind.',W/2,132,P.stone3,'center');
  }
  S.t++;
  // scale to window, integer factor, letterboxed
  const k=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  if(cv.width!==W*k){cv.width=W*k;cv.height=H*k;}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,W*k,H*k);
}
let last=0;function frame(ts){if(ts-last>=1000/60){last=ts;update();draw();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
