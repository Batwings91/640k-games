<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ironcrown — campaign prototype</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:default}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script src="sim.js"></script>
<script src="scenes.js"></script>
<script>
// Ironcrown campaign prototype, UI layer. All rules live in sim.js (shared with balance.js).
// 800x600, colours snapped to the VGA DAC. England and Wales, 18 provinces, 18 lords.
'use strict';
const W=800,H=600;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const g=off.getContext('2d');
function vga(hex){const n=parseInt(hex.slice(1),16);const q=v=>((v>>2)<<2)|((v>>2)>>4);return '#'+[16,8,0].map(s=>q((n>>s)&255).toString(16).padStart(2,'0')).join('');}
const P={};
Object.entries({ink:'#101018',paper:'#f0e0b8',parch:'#d8c89c',gold:'#f0c040',red:'#c02020',white:'#fcfcfc',grey:'#585860',lgrey:'#b0b0b8',
  sea1:'#183060',sea2:'#2c4c8c',sea3:'#4870b0',neutral:'#8c7c5c',neutral2:'#a89468',border:'#3c2c1c',road:'#e0d0a0',
  hill:'#6c5c3c',forest:'#2c5c2c',marsh:'#4c6c5c'}).forEach(([k,v])=>P[k]=vga(v));
const EARLCOL=[[vga('#3050d0'),vga('#6080f0')],[vga('#c03030'),vga('#e06060')],[vga('#30a040'),vga('#60c070')],[vga('#d0a020'),vga('#f0c860')]];
const seed0=(+new URLSearchParams(location.search).get('seed'))||(Date.now()&0xffff);

// ---- UI state ----
let G=null;
const U={phase:'choose',sel:null,mode:null,stance:1,leave:2,rival:1,stake:10,purse:5,offer:null,scenes:[],after:null,skipAll:false};
try{U.skipAll=localStorage.getItem('ironcrown.skipScenes')==='1';}catch(e){}
function setSkip(v){U.skipAll=v;try{localStorage.setItem('ironcrown.skipScenes',v?'1':'0');}catch(e){}}
// Pull scenes from sim events. Called after every player action and after the season ends.
function flushScenes(next){const sc=Scenes.fromEvents(G.events,G,me());G.events.length=0;if(!sc.length||U.skipAll){if(next)next();return;}U.scenes=sc;U.sceneTotal=sc.length;U.after=next||null;U.phase='scene';}
function nextScene(){U.scenes.shift();if(U.scenes.length)return;U.phase='play';const f=U.after;U.after=null;if(f)f();}
// mode: null | 'march' | 'raid' | 'marry' | 'turn' | 'pardon'

function start(earl){G=Sim.createGame(seed0,earl);U.phase='play';U.rival=[0,1,2,3].find(l=>l!==earl);U.sel=Sim.SEATS.findIndex((s,i)=>G.prov[i].owner===earl&&G.prov[i].home);flushScenes();}
function me(){return G.player;}
function canAct(p){return p&&p.owner===me()&&U.phase==='play';}
function deedsLeft(){return Sim.maxDeeds(G,me())-G.deeds;}
function useDeed(ok){if(ok)G.deeds++;U.mode=null;flushScenes();}

function doMarch(to){
  const from=U.sel,p=G.prov[from];
  if(G.moved){Sim.say(G,'One army marches a season.');return;}
  if(Sim.season(G)==='Winter'){Sim.say(G,'No marching in winter.');return;}
  if(!Sim.adj(from,to)){Sim.say(G,'Not adjacent.');return;}
  const leave=Math.min(U.leave,p.soldiers);
  const r=Sim.march(G,from,to,leave,U.stance);
  if(r.offer){U.offer=r.offer;flushScenes(()=>{U.phase='offer';});if(U.phase!=='scene')U.phase='offer';return;}
  if(r.ok){G.moved=true;U.sel=to;}
  flushScenes();
}
function answerOffer(accept){const o=U.offer;U.phase='play';U.offer=null;const r=Sim.march(G,o.from,o.to,o.leave,o.stance,accept);if(r.ok){G.moved=true;U.sel=o.to;}flushScenes();}
function endSeason(){if(U.phase!=='play')return;Sim.endSeason(G);flushScenes(()=>{if(G.over)U.phase='over';});if(U.phase==='play'&&G.over)U.phase='over';}

// ---- input ----
let buttons=[];
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
function hit(x,y){
  for(const b of buttons)if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){b.f();return;}
  if(U.phase!=='play')return;
  for(const p of G.prov)if(inPoly(x,y,Sim.MAP.cells[p.id].poly)){
    if(U.mode&&U.sel!==null&&p.id!==U.sel){
      if(U.mode==='march')doMarch(p.id);
      else if(deedsLeft()<=0)Sim.say(G,'No deeds left this season.');
      else if(U.mode==='raid'){if(!Sim.adj(U.sel,p.id))Sim.say(G,'Not adjacent.');else useDeed(Sim.raid(G,U.sel,p.id));}
      else if(U.mode==='marry')useDeed(Sim.marry(G,me(),p.id));
      else if(U.mode==='turn')useDeed(Sim.turnVassal(G,me(),p.id));
      else if(U.mode==='pardon')useDeed(Sim.pardon(G,me(),p.id));
      U.mode=null;return;
    }
    U.sel=p.id;U.mode=null;return;
  }
}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();hit((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);});
addEventListener('keydown',e=>{
  if(U.phase==='scene'){if(e.key==='Escape'){setSkip(true);U.scenes=[];nextScene();}else nextScene();return;}
  if(U.phase!=='play')return;
  if(e.key==='Enter')endSeason();
  const p=U.sel!==null?G.prov[U.sel]:null;
  if(e.key==='t'&&canAct(p)&&!p.vassal)p.tax=p.tax===0.5?1:p.tax===1?1.5:0.5;
  if(e.key==='s'&&canAct(p))Sim.buy(G,me(),p.id,'soldier');if(e.key==='k'&&canAct(p))Sim.buy(G,me(),p.id,'knight');if(e.key==='c'&&canAct(p))Sim.buy(G,me(),p.id,'castle');
  if(e.key==='[')U.leave=Math.max(0,U.leave-1);if(e.key===']')U.leave++;
  if(e.key==='m')U.mode=U.mode==='march'?null:'march';
});

// ---- drawing ----
const FONT='bold 14px monospace',SMALL='12px monospace';
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
function text(s,x,y,c,align,font){g.font=font||FONT;g.textBaseline='top';g.textAlign=align||'left';if(c!==P.ink){g.fillStyle=P.ink;g.fillText(s,x+1,y+1);}g.fillStyle=c||P.paper;g.fillText(s,x,y);}
function path(pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();}
function poly(pts,c){g.fillStyle=c;path(pts);g.fill();}
function outline(pts,c,w){g.strokeStyle=c;g.lineWidth=w;path(pts);g.stroke();}
function button(x,y,w,h,label,f,on){buttons.push({x,y,w,h,f});rect(x,y,w,h,on?P.paper:P.grey);rect(x,y+h-2,w,2,on?P.parch:P.ink);text(label,x+6,y+4,on?P.ink:P.paper,'left',h<20?SMALL:FONT);}
function ownerCol(p,alt){return p.owner<0?(alt?P.neutral2:P.neutral):EARLCOL[p.owner][alt?1:0];}
function castleIcon(x,y,c){rect(x,y+4,16,10,c);rect(x,y,3,4,c);rect(x+6,y,4,4,c);rect(x+13,y,3,4,c);rect(x+6,y+9,4,5,P.ink);}
function box(x,y,w,h){rect(x,y,w,h,P.ink);rect(x+4,y+4,w-8,h-8,P.paper);}

function drawMap(){
  rect(0,24,520,576,P.sea1);
  for(let y=24;y<600;y+=3)for(let x=((y/3)&1)*2;x<520;x+=4)rect(x,y,1,1,P.sea2);
  G.prov.forEach(p=>{
    const cell=Sim.MAP.cells[p.id];
    poly(cell.poly,ownerCol(p));
    g.save();path(cell.poly);g.clip();
    const tc=p.terrain==='hills'?P.hill:p.terrain==='forest'?P.forest:p.terrain==='marsh'?P.marsh:null;
    if(tc){const xs=cell.poly.map(q=>q.x),ys=cell.poly.map(q=>q.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      for(let yy=y0;yy<y1;yy+=5)for(let xx=x0+(((yy/5)|0)&1)*2;xx<x1;xx+=5){if(p.terrain==='hills'){rect(xx,yy,1,1,tc);rect(xx+1,yy-1,1,1,tc);rect(xx+2,yy,1,1,tc);}else if(p.terrain==='forest'){rect(xx,yy,2,2,tc);rect(xx+1,yy-1,1,1,tc);}else rect(xx,yy,3,1,tc);}}
    if(p.vassal){for(let yy=y0v(cell);yy<y1v(cell);yy+=8)for(let xx=x0v(cell);xx<x1v(cell);xx+=8)rect(xx,yy,3,1,ownerCol(p,true));}
    g.restore();
    outline(cell.poly,P.border,1.5);
  });
  outline(Sim.MAP.coastPoly,P.sea3,1);
  g.strokeStyle=P.road;g.lineWidth=1;g.setLineDash([3,3]);
  G.prov.forEach(p=>[...Sim.MAP.adj[p.id]].forEach(j=>{if(j>p.id){const a=Sim.MAP.cells[p.id],b=Sim.MAP.cells[j];g.beginPath();g.moveTo(a.cx,a.cy+8);g.lineTo(b.cx,b.cy+8);g.stroke();}}));
  g.setLineDash([]);
  G.prov.forEach(p=>{
    const cell=Sim.MAP.cells[p.id],cx=cell.cx,cy=cell.cy;
    if(U.sel===p.id)outline(cell.poly,P.white,3);
    if(U.mode&&U.sel!==null&&targetable(p))outline(cell.poly,P.gold,2);
    text(p.name,cx,cy-22,P.paper,'center');
    const inc=p.owner>=0?Sim.provIncome(G,p):p.base;
    text(inc+'g'+(p.owner>=0&&!p.vassal&&p.tax!==1?(p.tax>1?' !':' -'):''),cx,cy-6,P.gold,'center');
    let ix=cx-((p.castle?18:0)+(p.feature==='crown'?18:0)+(p.market?12:0)+(p.mill?8:0))/2;
    if(p.castle){castleIcon(ix,cy+8,P.lgrey);ix+=18;}
    if(p.feature==='crown'){rect(ix,cy+13,16,7,P.gold);rect(ix,cy+9,2,4,P.gold);rect(ix+7,cy+8,2,5,P.gold);rect(ix+14,cy+9,2,4,P.gold);ix+=18;}
    if(p.market){rect(ix,cy+10,9,9,P.paper);rect(ix+2,cy+12,5,5,P.red);ix+=12;}
    if(p.mill){rect(ix+2,cy+8,3,12,P.road);rect(ix,cy+8,7,2,P.road);}
    const army=(p.soldiers+p.knights?p.soldiers+(p.knights?'+'+p.knights+'k':'')+(p.engines?'+'+p.engines+'e':''):'')+(p.levy?(p.soldiers+p.knights?' ':'')+'('+p.levy+')':'');
    text(army,cx,cy+24,p.owner===me()?P.white:P.paper,'center',SMALL);
    if(p.vassal)text('loyal '+p.lord.loyalty,cx,cy+38,p.lord.loyalty<=3?P.red:P.lgrey,'center',SMALL);
    else if(p.unrest>=3)text('unrest '+p.unrest,cx,cy+38,P.red,'center',SMALL);
  });
}
function x0v(c){return Math.min(...c.poly.map(q=>q.x));}function x1v(c){return Math.max(...c.poly.map(q=>q.x));}
function y0v(c){return Math.min(...c.poly.map(q=>q.y));}function y1v(c){return Math.max(...c.poly.map(q=>q.y));}
function targetable(p){
  const s=G.prov[U.sel];
  if(U.mode==='march'||U.mode==='raid')return Sim.adj(U.sel,p.id)&&(U.mode==='march'||p.owner!==me());
  if(U.mode==='marry')return p.owner<0&&p.lord&&!p.lord.dispossessed&&p.lord.temper!=='city'&&Sim.neighbours(G,p.id).some(q=>q.owner===me());
  if(U.mode==='turn')return p.vassal&&p.owner>=0&&p.owner!==me();
  if(U.mode==='pardon')return p.owner===me()&&p.lord&&p.lord.dispossessed;
  return false;
}

function drawPanel(){
  const px=534;rect(520,24,280,576,P.grey);rect(524,28,272,568,P.ink);
  const p=U.sel!==null?G.prov[U.sel]:null;
  if(!p){text('Click a province.',px,40,P.paper);return;}
  text(p.name,px,36,P.gold);
  text(p.terrain+(p.feature?', '+p.feature:''),px,54,P.lgrey,'left',SMALL);
  const who=p.owner<0?(p.lord?p.lord.name+' ('+p.lord.temper+')':'no lord'):G.lords[p.owner].name+(p.home?' (home)':p.vassal?', vassal':'');
  text(who,px,68,ownerCol(p,true),'left',SMALL);
  if(p.vassal)text(p.lord.name+' ('+p.lord.temper+'), loyalty '+p.lord.loyalty,px,82,P.lgrey,'left',SMALL);
  else if(p.lord&&p.lord.dispossessed)text(p.lord.name+', dispossessed'+(p.lord.host>=0?', at '+G.lords[p.lord.host].name+'\'s court':''),px,82,P.red,'left',SMALL);
  text('Base '+p.base+'g, '+(p.vassal?'vassal dues':p.tax===1?'fair tax':p.tax>1?'harsh tax':'low tax'),px,100,P.paper);
  text('Pays '+(p.owner>=0?Sim.provIncome(G,p):'-')+'g'+(p.vassal?'':', unrest '+p.unrest),px,118,P.paper);
  text('Men '+p.soldiers+'  Kn '+p.knights+'  Eng '+p.engines+'  Levy '+p.levy,px,136,P.paper);
  text('Defends at '+Sim.strength(G,p,false),px,154,P.lgrey);
  if(!canAct(p)){
    if(p.owner!==me()){text(Sim.neighbours(G,p.id).some(q=>q.owner===me())?'On your border.':'Not on your border.',px,180,P.lgrey);
      text('Select your province, pick',px,200,P.grey,'left',SMALL);text('March or a deed, then click here.',px,214,P.grey,'left',SMALL);}
    return;
  }
  const bw=250,bh=20;let y=176;
  if(!p.vassal){
    button(px,y,bw,bh,'Tax: '+(p.tax===1?'fair':p.tax>1?'harsh':'low')+'  (t)',()=>{p.tax=p.tax===0.5?1:p.tax===1?1.5:0.5;},true);y+=22;
    const kc=Sim.season(G)==='Spring'?6:8,cc=p.feature==='quarry'?12:20;
    button(px,y,122,bh,'Soldier 1g (s)',()=>Sim.buy(G,me(),p.id,'soldier'),G.gold[me()]>=1&&p.castle);
    button(px+128,y,122,bh,'Knight '+kc+'g (k)',()=>Sim.buy(G,me(),p.id,'knight'),G.gold[me()]>=kc&&p.castle&&!G.knightBought);y+=22;
    button(px,y,122,bh,'Engine 15g',()=>Sim.buy(G,me(),p.id,'engine'),G.gold[me()]>=15&&p.castle);
    button(px+128,y,122,bh,p.castle?'Castle built':'Castle '+cc+'g (c)',()=>Sim.buy(G,me(),p.id,'castle'),!p.castle&&G.gold[me()]>=cc);y+=22;
    button(px,y,122,bh,p.mill?'Mill built':'Mill 5g',()=>Sim.buy(G,me(),p.id,'mill'),!p.mill&&G.gold[me()]>=5);
    button(px+128,y,122,bh,p.market?'Market held':'Market 12g',()=>Sim.buy(G,me(),p.id,'market'),!p.market&&G.gold[me()]>=12);y+=22;
  }else{text('A vassal rules here. You may station',px,y,P.lgrey,'left',SMALL);text('troops, not tax or build.',px,y+14,P.lgrey,'left',SMALL);y+=36;}
  y+=6;
  button(px,y,110,bh,U.mode==='march'?'Pick target':'March (m)',()=>{U.mode=U.mode==='march'?null:'march';},!G.moved&&Sim.season(G)!=='Winter'&&p.soldiers+p.knights>0);
  button(px+116,y,76,bh,Sim.STANCE[U.stance],()=>{U.stance=(U.stance+1)%3;});
  button(px+198,y,24,bh,'-',()=>{U.leave=Math.max(0,U.leave-1);});button(px+226,y,24,bh,'+',()=>{U.leave++;});y+=22;
  text('leave '+U.leave+(G.moved?', marched':'')+'. Odds in the log.',px,y,P.lgrey,'left',SMALL);y+=20;
  const dl=deedsLeft();text('Deeds left: '+dl,px,y,dl?P.gold:P.grey);y+=18;
  const md=(m,label,ok)=>button(px,y,122,bh,U.mode===m?'Pick target':label,()=>{U.mode=U.mode===m?null:m;},ok&&dl>0);
  md('raid','Raid (knight)',p.knights>0);
  button(px+128,y,122,bh,'Tourney v '+G.lords[U.rival].name.slice(0,6),()=>{if(dl>0)useDeed(Sim.tournament(G,me(),U.rival,U.stake,U.purse));},dl>0&&G.gold[me()]>=U.stake+U.purse);y+=22;
  button(px,y,76,bh,'v '+G.lords[U.rival].name.slice(0,5),()=>{do{U.rival=(U.rival+1)%4;}while(U.rival===me()||!G.alive[U.rival]);});
  button(px+82,y,80,bh,'stake '+U.stake,()=>{U.stake=U.stake>=20?5:U.stake+5;});button(px+168,y,82,bh,'purse '+U.purse,()=>{U.purse=U.purse>=15?0:U.purse+5;});y+=22;
  md('marry','Marry (15g)',G.lords[me()].renown>=5&&G.gold[me()]>=15);
  button(px+128,y,122,bh,U.mode==='turn'?'Pick target':'Turn a vassal',()=>{U.mode=U.mode==='turn'?null:'turn';},dl>0);y+=22;
  md('pardon','Pardon a lord',G.prov.some(q=>q.owner===me()&&q.lord&&q.lord.dispossessed));
  button(px+128,y,122,bh,'Ally v '+G.lords[U.rival].name.slice(0,6),()=>{if(dl>0)useDeed(Sim.ally(G,me(),U.rival));},dl>0);y+=22;
  button(px,y,bw,bh,'Draw a court card',()=>{if(dl>0)useDeed(Sim.drawCard(G,me()));},dl>0);y+=22;
}

function draw(){
  buttons=[];rect(0,0,W,H,P.ink);
  if(U.phase==='choose'){
    box(60,60,680,480);
    text('IRONCROWN — the land and the gold',W/2,80,P.red,'center');
    text('Choose your earl. Twelve years to take London and the crown of England.',W/2,110,P.ink,'center');
    Sim.EARLS.forEach((e,i)=>{const x=90+i*165,y=150;rect(x,y,150,250,P.ink);rect(x+3,y+3,144,244,EARLCOL[i][0]);
      text(e.name,x+75,y+12,P.white,'center');text(e.title,x+75,y+32,P.paper,'center',SMALL);
      ['Lead '+e.lead,'Steward '+e.stew,'Cunning '+e.cun,'Renown '+e.renown].forEach((s,k)=>text(s,x+75,y+70+k*20,P.paper,'center',SMALL));
      text(i===0||i===1?'far corner, 2 lands':'near corner, 1 land',x+75,y+160,P.paper,'center',SMALL);
      button(x+25,y+205,100,24,'Play',()=>start(i),true);});
    ['Every province has a lord. March on a weak one and they may kneel and become your vassal:','their land pays you and defends itself, and their loyalty (0 to 10) is on the map.',
     'Refuse or beat them and the lord is dispossessed, flees to a rival, and may come back.','Every fight: points v points, odds shown, your stance sets the risk. One march a season,',
     'one deed (two from six lands). Winter freezes armies left outside walls.'].forEach((s,i)=>text(s,W/2,420+i*18,P.ink,'center',SMALL));
    button(300,505,200,22,U.skipAll?'Scenes: off':'Scenes: on',()=>setSkip(!U.skipAll),!U.skipAll);
    finish();return;
  }
  drawMap();
  rect(0,0,W,24,P.ink);
  text(Sim.season(G)+', year '+Sim.year(G),8,5,P.paper);
  text('Treasury '+G.gold[me()]+'g   Income '+Sim.income(G,me())+'g   Land '+Sim.count(G,me())+'/18   Renown '+G.lords[me()].renown,200,5,P.gold);
  drawPanel();
  const px=534;
  for(let l=0,k=0;l<4;l++){if(l===me())continue;const L=G.lords[l];rect(px,452+k*16,10,10,EARLCOL[l][0]);text(L.name+': '+(G.alive[l]?Sim.count(G,l)+' lands, '+Sim.income(G,l)+'g, renown '+L.renown+(G.allies[Sim.key(me(),l)]>G.turn?', ally':''):'gone'),px+16,450+k*16,P.lgrey,'left',SMALL);k++;}
  rect(px,502,250,1,P.grey);
  const lines=G.log.slice(-4);lines.forEach((s,i)=>text(s.length>36?s.slice(0,35)+'…':s,px,506+i*15,i===lines.length-1?P.paper:P.grey,'left',SMALL));
  button(px,570,250,24,'END SEASON  (Enter)',endSeason,U.phase==='play');
  if(U.phase==='offer'){
    const o=U.offer,D=G.prov[o.to];box(150,180,500,200);
    text(D.lord.name+' of '+D.name+' offers to kneel.',W/2,200,P.red,'center');
    text('Your '+o.as+' points against their '+o.ds+'.',W/2,232,P.ink,'center');
    text('Accept: they keep their seat as your vassal at loyalty 5.',W/2,254,P.ink,'center',SMALL);
    text('Their land pays you and their levy defends it.',W/2,270,P.ink,'center',SMALL);
    text('Refuse: battle, and conquest if you win.',W/2,286,P.ink,'center',SMALL);
    button(220,320,150,28,'Accept homage',()=>answerOffer(true),true);button(430,320,150,28,'Refuse, attack',()=>answerOffer(false),false);
  }
  if(U.phase==='scene'&&U.scenes.length){
    const sc=U.scenes[0];box(80,120,640,300);
    // placeholder painting: a framed portrait with initials
    rect(100,140,120,150,P.ink);rect(104,144,112,142,P.parch);text(sc.initials||'?',160,196,P.ink,'center','bold 28px monospace');
    text(sc.title,240,146,P.red);
    sc.lines.forEach((l,i)=>wrap(l,240,176+i*44,460,P.ink));
    button(100,370,200,24,'Continue  (any key)',nextScene,true);
    button(420,370,200,24,'Skip all scenes  (Esc)',()=>{setSkip(true);U.scenes=[];nextScene();},false);
    text('Scene '+(U.sceneTotal-U.scenes.length+1)+' of '+U.sceneTotal+'. Placeholder painting.',W/2,346,P.grey,'center',SMALL);
  }
  if(U.phase==='over'){
    box(150,200,500,180);const o=G.over;
    const how={crown:'holds London and the crown',treasury:'commands the wealth of England',last:'is the last lord standing',time:'has the greatest income after twelve years'}[o.how]||'';
    text(o.l===me()?'YOU WEAR THE CROWN':o.l<0?'YOUR LINE IS ENDED':G.lords[o.l].name.toUpperCase()+' TAKES THE CROWN',W/2,220,P.red,'center');
    text(o.l>=0?G.lords[o.l].name+' '+how+'.':'You hold no land.',W/2,256,P.ink,'center');
    text('Year '+Sim.year(G)+'. Your income '+Sim.income(G,me())+'g, land '+Sim.count(G,me())+'.',W/2,290,P.ink,'center');
    text('Seed #'+G.seed0.toString(16)+'. Reload to play again.',W/2,330,P.ink,'center');
  }
  finish();
}
function wrap(s,x,y,w,c){g.font=SMALL;const words=s.split(' ');let line='',yy=y;words.forEach(wd=>{const t=line?line+' '+wd:wd;if(g.measureText(t).width>w){text(line,x,yy,c,'left',SMALL);line=wd;yy+=15;}else line=t;});if(line)text(line,x,yy,c,'left',SMALL);}
function finish(){let k=Math.min(innerWidth/W,innerHeight/H);if(k>=2)k=Math.floor(k);const cw=Math.round(W*k),ch=Math.round(H*k);if(cv.width!==cw){cv.width=cw;cv.height=ch;}ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,cw,ch);}
function frame(){draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
