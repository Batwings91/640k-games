<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ironcrown — campaign prototype</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:default}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script src="sim.js"></script>
<script src="scenes.js"></script>
<script>
// Ironcrown campaign prototype, UI layer. All rules live in sim.js (shared with balance.js).
// 800x600, colours snapped to the VGA DAC. England and Wales, 18 provinces, 18 lords.
'use strict';
const W=800,H=600;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const g=off.getContext('2d');
function vga(hex){const n=parseInt(hex.slice(1),16);const q=v=>((v>>2)<<2)|((v>>2)>>4);return '#'+[16,8,0].map(s=>q((n>>s)&255).toString(16).padStart(2,'0')).join('');}
const P={};
Object.entries({ink:'#101018',paper:'#f0e0b8',parch:'#d8c89c',gold:'#f0c040',red:'#c02020',white:'#fcfcfc',grey:'#585860',lgrey:'#b0b0b8',
  sea1:'#183060',sea2:'#2c4c8c',sea3:'#4870b0',neutral:'#8c7c5c',neutral2:'#a89468',border:'#3c2c1c',road:'#e0d0a0',
  hill:'#6c5c3c',forest:'#2c5c2c',marsh:'#4c6c5c',skin:'#e0b090',skin2:'#c09070',hair1:'#503018',hair2:'#d0b060',hair3:'#a03020',hair4:'#282020',eye:'#181018'}).forEach(([k,v])=>P[k]=vga(v));
const EARLCOL=[[vga('#3050d0'),vga('#6080f0')],[vga('#c03030'),vga('#e06060')],[vga('#30a040'),vga('#60c070')],[vga('#d0a020'),vga('#f0c860')]];
const EARLNAMECOL=['blue','red','green','gold'];
const seed0=(+new URLSearchParams(location.search).get('seed'))||(Date.now()&0xffff);

// ---- UI state ----
let G=null,frameN=0;
const U={phase:'choose',sel:null,mode:null,stance:1,moveN:0,rival:1,stake:10,purse:5,offer:null,scenes:[],after:null,skipAll:false,
  flash:null,confirm:null,play:null,tutorial:0,help:false};
// phase: choose | play | offer | confirm | scene | turnplay | over.   mode: null | march | raid | marry | turn | pardon
try{U.skipAll=localStorage.getItem('ironcrown.skipScenes')==='1';}catch(e){}
function setSkip(v){U.skipAll=v;try{localStorage.setItem('ironcrown.skipScenes',v?'1':'0');}catch(e){}}
function flash(s,c){U.flash={s,c:c||P.gold,t:frameN};}
function flushScenes(next){const sc=Scenes.fromEvents(G.events,G,me());G.events.length=0;if(!sc.length||U.skipAll){if(next)next();return;}U.scenes=sc;U.sceneTotal=sc.length;U.after=next||null;U.phase='scene';}
function nextScene(){U.scenes.shift();if(U.scenes.length)return;U.phase='play';const f=U.after;U.after=null;if(f)f();}
function start(earl){G=Sim.createGame(seed0,earl);U.phase='play';U.rival=[0,1,2,3].find(l=>l!==earl);U.sel=G.prov.findIndex(p=>p.owner===earl&&p.home);U.tutorial=1;flushScenes();}
function me(){return G.player;}
function canAct(p){return p&&p.owner===me()&&U.phase==='play';}
function deedsLeft(){return Sim.maxDeeds(G,me())-G.deeds;}
function useDeed(ok){if(ok)G.deeds++;U.mode=null;flushScenes();}
function lastLog(){return G.log[G.log.length-1];}

// ---- marching: pick a count, pick a destination, confirm with the odds shown ----
function beginMarch(){const p=G.prov[U.sel];if(G.moved){flash('One army marches a season. Already marched.',P.red);return;}
  if(Sim.season(G)==='Winter'){flash('No marching in winter. End the season.',P.red);return;}
  if(p.soldiers+p.knights<=0){flash('No men here to march.',P.red);return;}
  U.mode='march';U.moveN=Math.max(0,p.soldiers-2);flash('Set how many march, then click a highlighted neighbour.');}
function pickDestination(to){
  const from=U.sel,A=G.prov[from];
  if(!Sim.adj(from,to)){flash('Not next door. Highlighted provinces only.',P.red);return;}
  const pv=Sim.preview(G,from,to,U.moveN,U.stance);
  if(U.moveN+A.knights<=0){flash('Nobody would march. Raise the count.',P.red);return;}
  if(pv.needEngine){flash('Walls there. You need a siege engine in this army.',P.red);return;}
  if(pv.ally){flash('You are sworn to peace with them.',P.red);return;}
  U.confirm={from,to,pv};U.phase='confirm';
}
function doConfirm(){
  const c=U.confirm;U.phase='play';U.confirm=null;U.mode=null;
  const A=G.prov[c.from],leave=A.soldiers-U.moveN;
  const r=Sim.march(G,c.from,c.to,leave,U.stance);
  if(r.offer){U.offer=r.offer;flushScenes(()=>{U.phase='offer';});if(U.phase!=='scene')U.phase='offer';return;}
  if(r.ok){G.moved=true;U.sel=c.to;flash(lastLog());}else flash(lastLog(),P.red);
  flushScenes();
}
function answerOffer(accept){const o=U.offer;U.phase='play';U.offer=null;const r=Sim.march(G,o.from,o.to,o.leave,o.stance,accept);if(r.ok){G.moved=true;U.sel=o.to;flash(lastLog());}flushScenes();}

// ---- end of season: play the events back with flashing provinces, then the player's scenes ----
function endSeason(){
  if(U.phase!=='play')return;
  const goldBefore=G.gold[me()],landBefore=Sim.count(G,me());
  const before=G.events.length;const seasonName=Sim.season(G)+', year '+Sim.year(G);
  Sim.endSeason(G);
  const evs=G.events.slice(before);
  const steps=[{prov:null,text:'The season of '+seasonName+' ends.',c:P.paper}];
  evs.forEach(e=>{const p=e.prov!=null?G.prov[e.prov]:null;const who=e.actor>=0&&e.actor!=null?G.lords[e.actor].name:'';const lord=p&&p.lord?p.lord.name:'';
    const T={battle:e.won?who+' takes '+(p?p.name:'')+' ('+e.as+' v '+e.ds+').':who+' is thrown back at '+(p?p.name:'')+' ('+e.as+' v '+e.ds+').',
      homage:lord+' of '+(p?p.name:'')+' kneels to '+who+'.',conquest:lord+' is driven out of '+(p?p.name:'')+'.',defection:lord+' of '+(p?p.name:'')+' renounces '+who+'.',
      returned:lord+' returns and '+(p?p.name:'')+' rises.',revolt:(p?p.name:'')+' revolts against '+who+'.',marriage:who+' marries into '+(p?p.name:'')+'.',pardon:who+' pardons '+lord+'.',
      frozen:'Men freeze at '+(p?p.name:'')+'.',move:who+' marches to '+(p?p.name:'')+'.'}[e.type];
    if(T)steps.push({prov:e.prov,text:T,c:e.actor===me()||e.target===me()?P.gold:P.lgrey,mine:e.actor===me()||e.target===me()});});
  const dg=G.gold[me()]-goldBefore;
  steps.push({prov:null,text:Sim.season(G)+', year '+Sim.year(G)+'. Treasury '+(dg>=0?'+':'')+dg+' gold, land '+Sim.count(G,me())+(Sim.count(G,me())!==landBefore?' (was '+landBefore+')':'')+'.',c:P.gold,big:true});
  U.play={steps,i:0,t:frameN};U.phase='turnplay';
}
function advancePlay(){const pl=U.play;pl.i++;pl.t=frameN;if(pl.i>=pl.steps.length){U.phase='play';U.play=null;flushScenes(()=>{if(G.over)U.phase='over';});if(U.phase==='play'&&G.over)U.phase='over';}}

// ---- input ----
let buttons=[];
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
function hit(x,y){
  for(const b of buttons)if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){if(b.on)b.f();else flash(b.why||'Not available now.',P.red);return;}
  if(U.phase==='scene'){nextScene();return;}
  if(U.phase==='turnplay'){advancePlay();return;}
  if(U.help){U.help=false;return;}
  if(U.phase==='confirm'){U.phase='play';U.confirm=null;return;}
  if(U.phase!=='play')return;
  for(const p of G.prov)if(inPoly(x,y,Sim.MAP.cells[p.id].poly)){
    if(!U.mode&&U.sel!==null&&p.id!==U.sel&&G.prov[U.sel].owner===me()&&Sim.adj(U.sel,p.id)&&U.phase==='play'){
      const A=G.prov[U.sel];
      if(G.moved){flash('You have marched this season. One army marches a season: END SEASON, then march again.',P.red);U.sel=p.id;return;}
      if(Sim.season(G)==='Winter'){flash('No marching in winter.',P.red);U.sel=p.id;return;}
      if(A.soldiers+A.knights<=0){flash('No men in '+A.name+' to march.',P.red);U.sel=p.id;return;}
      U.moveN=Math.max(0,A.soldiers-2);pickDestination(p.id);return;
    }
    if(U.mode&&U.sel!==null&&p.id!==U.sel){
      if(U.mode==='march'){pickDestination(p.id);return;}
      if(deedsLeft()<=0)flash('No deeds left this season.',P.red);
      else if(U.mode==='raid'){if(!Sim.adj(U.sel,p.id))flash('Raid a neighbour only.',P.red);else{useDeed(Sim.raid(G,U.sel,p.id));flash(lastLog());}}
      else if(U.mode==='marry'){useDeed(Sim.marry(G,me(),p.id));flash(lastLog());}
      else if(U.mode==='turn'){useDeed(Sim.turnVassal(G,me(),p.id));flash(lastLog());}
      else if(U.mode==='pardon'){useDeed(Sim.pardon(G,me(),p.id));flash(lastLog());}
      U.mode=null;return;
    }
    U.sel=p.id;U.mode=null;if(U.tutorial===1&&p.owner===me())U.tutorial=2;return;
  }
}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();hit((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);});
addEventListener('keydown',e=>{
  if(U.phase==='scene'){if(e.key==='Escape'){setSkip(true);U.scenes=[];nextScene();}else nextScene();return;}
  if(U.phase==='turnplay'){if(e.key==='Escape'){U.play.i=U.play.steps.length-1;}advancePlay();return;}
  if(U.phase==='confirm'){if(e.key==='Enter')doConfirm();if(e.key==='Escape'){U.phase='play';U.confirm=null;}return;}
  if(U.help){U.help=false;return;}
  if(e.key==='?'||e.key==='h'){U.help=true;return;}
  if(U.phase!=='play')return;
  if(e.key==='Enter')endSeason();
  const p=U.sel!==null?G.prov[U.sel]:null;
  if(e.key==='s'&&canAct(p))tryBuy(p,'soldier');if(e.key==='k'&&canAct(p))tryBuy(p,'knight');if(e.key==='c'&&canAct(p))tryBuy(p,'castle');
  if(e.key==='m'&&canAct(p))beginMarch();
  if(U.mode==='march'){if(e.key==='['||e.key==='ArrowLeft')U.moveN=Math.max(0,U.moveN-1);if(e.key===']'||e.key==='ArrowRight')U.moveN=Math.min(p.soldiers,U.moveN+1);}
});
function tryBuy(p,kind){const before=G.gold[me()];const ok=Sim.buy(G,me(),p.id,kind);if(ok)flash('Bought: '+kind+' for '+(before-G.gold[me()])+' gold.');else flash(lastLog(),P.red);if(ok&&U.tutorial===2)U.tutorial=3;}

// ---- drawing ----
const FONT='bold 14px monospace',SMALL='12px monospace';
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
function text(s,x,y,c,align,font){g.font=font||FONT;g.textBaseline='top';g.textAlign=align||'left';if(c!==P.ink){g.fillStyle=P.ink;g.fillText(s,x+1,y+1);}g.fillStyle=c||P.paper;g.fillText(s,x,y);}
function wrap(s,x,y,w,c,font){g.font=font||SMALL;const words=s.split(' ');let line='',yy=y;words.forEach(wd=>{const t=line?line+' '+wd:wd;if(g.measureText(t).width>w){text(line,x,yy,c,'left',font||SMALL);line=wd;yy+=15;}else line=t;});if(line)text(line,x,yy,c,'left',font||SMALL);return yy+15;}
function path(pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();}
function poly(pts,c){g.fillStyle=c;path(pts);g.fill();}
function outline(pts,c,w){g.strokeStyle=c;g.lineWidth=w;path(pts);g.stroke();}
function button(x,y,w,h,label,f,on,why){buttons.push({x,y,w,h,f,on:on!==false,why});rect(x,y,w,h,on!==false?P.paper:P.grey);rect(x,y+h-2,w,2,on!==false?P.parch:P.ink);text(label,x+6,y+4,on!==false?P.ink:P.lgrey,'left',h<20?SMALL:FONT);}
function ownerCol(p,alt){return p.owner<0?(alt?P.neutral2:P.neutral):EARLCOL[p.owner][alt?1:0];}
function castleIcon(x,y,c){rect(x,y+4,16,10,c);rect(x,y,3,4,c);rect(x+6,y,4,4,c);rect(x+13,y,3,4,c);rect(x+6,y+9,4,5,P.ink);}
function box(x,y,w,h){rect(x,y,w,h,P.ink);rect(x+4,y+4,w-8,h-8,P.paper);}
// a crude pixel portrait per earl: 0 Osric (grey-bearded, blue), 1 Aldric (red-haired, scarred), 2 Berta (fair, veil), 3 Gwyn (dark, hooded)
function face(x,y,s,i){const u=s/16;const R=(px,py,w,h,c)=>rect(x+px*u,y+py*u,w*u,h*u,c);
  R(0,0,16,16,EARLCOL[i][1]);R(3,3,10,11,P.skin);R(3,3,10,1,P.skin2);
  const hair=[P.lgrey,P.hair3,P.hair2,P.hair4][i];
  R(3,2,10,2,hair);R(2,3,1,5,hair);R(13,3,1,5,hair);
  if(i===0){R(4,10,8,4,P.lgrey);R(5,14,6,1,P.lgrey);}          // beard
  if(i===1){R(9,5,1,5,P.red);R(4,11,8,2,P.hair3);}             // scar, short beard
  if(i===2){R(2,1,12,2,P.paper);R(1,3,2,11,P.paper);R(13,3,2,11,P.paper);} // veil
  if(i===3){R(1,1,14,3,P.grey);R(1,4,2,9,P.grey);R(13,4,2,9,P.grey);}   // hood
  R(5,7,2,1,P.eye);R(9,7,2,1,P.eye);R(7,9,2,1,P.skin2);R(6,12,4,1,P.hair4);
  R(0,15,16,1,P.ink);R(0,0,16,1,P.ink);R(0,0,1,16,P.ink);R(15,0,1,16,P.ink);}

function hintText(){
  const p=U.sel!==null?G.prov[U.sel]:null,mine=G.lords[me()];
  if(U.mode==='march')return 'Click a blinking neighbour to march there.';
  if(U.mode)return 'Click a gold-outlined province to '+U.mode+'.';
  if(!p||p.owner!==me())return 'You are '+mine.name+' ('+EARLNAMECOL[me()]+'). Click one of your '+EARLNAMECOL[me()]+' provinces, then click a neighbour to attack it.';
  if(Sim.season(G)==='Winter')return 'Winter: nobody marches. Buy and build, then END SEASON.';
  if(G.moved)return 'Your army has marched this season. Buy, build, use a deed, then END SEASON. Next season you can march again.';
  if(p.soldiers+p.knights>0)return 'Click a neighbour of '+p.name+' to march on it. You will see the odds before deciding.';
  return 'No men here. Recruit at a castle, or select the province where your army is.';
}

function drawMap(){
  rect(0,24,520,576,P.sea1);
  for(let y=24;y<600;y+=3)for(let x=((y/3)&1)*2;x<520;x+=4)rect(x,y,1,1,P.sea2);
  const blinkOn=(frameN>>3)&1;
  const playing=U.phase==='turnplay'&&U.play.steps[U.play.i]&&U.play.steps[U.play.i].prov!=null?U.play.steps[U.play.i].prov:null;
  G.prov.forEach(p=>{
    const cell=Sim.MAP.cells[p.id];
    let col=ownerCol(p);if(playing===p.id&&blinkOn)col=P.white;
    poly(cell.poly,col);
    g.save();path(cell.poly);g.clip();
    const tc=p.terrain==='hills'?P.hill:p.terrain==='forest'?P.forest:p.terrain==='marsh'?P.marsh:null;
    const xs=cell.poly.map(q=>q.x),ys=cell.poly.map(q=>q.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    if(tc&&playing!==p.id){for(let yy=y0;yy<y1;yy+=5)for(let xx=x0+(((yy/5)|0)&1)*2;xx<x1;xx+=5){if(p.terrain==='hills'){rect(xx,yy,1,1,tc);rect(xx+1,yy-1,1,1,tc);rect(xx+2,yy,1,1,tc);}else if(p.terrain==='forest'){rect(xx,yy,2,2,tc);rect(xx+1,yy-1,1,1,tc);}else rect(xx,yy,3,1,tc);}}
    if(p.vassal){for(let yy=y0;yy<y1;yy+=8)for(let xx=x0;xx<x1;xx+=8)rect(xx,yy,3,1,ownerCol(p,true));}
    g.restore();
    outline(cell.poly,P.border,1.5);
  });
  outline(Sim.MAP.coastPoly,P.sea3,1);
  g.strokeStyle=P.road;g.lineWidth=1;g.setLineDash([3,3]);
  G.prov.forEach(p=>[...Sim.MAP.adj[p.id]].forEach(j=>{if(j>p.id){const a=Sim.MAP.cells[p.id],b=Sim.MAP.cells[j];g.beginPath();g.moveTo(a.cx,a.cy+8);g.lineTo(b.cx,b.cy+8);g.stroke();}}));
  g.setLineDash([]);
  G.prov.forEach(p=>{
    const cell=Sim.MAP.cells[p.id],cx=cell.cx,cy=cell.cy;
    if(U.sel===p.id&&U.phase!=='turnplay')outline(cell.poly,P.white,3);
    if(U.mode&&U.sel!==null&&targetable(p)&&(blinkOn||U.mode!=='march'))outline(cell.poly,P.gold,2);
    text(p.name,cx,cy-22,P.paper,'center');
    const inc=p.owner>=0?Sim.provIncome(G,p):p.base;
    text(inc+' gold'+(p.owner>=0&&!p.vassal&&p.tax!==1?(p.tax>1?' !':' -'):''),cx,cy-6,P.gold,'center',SMALL);
    let ix=cx-((p.castle?18:0)+(p.feature==='crown'?18:0)+(p.market?12:0)+(p.mill?8:0))/2;
    if(p.castle){castleIcon(ix,cy+8,P.lgrey);ix+=18;}
    if(p.feature==='crown'){rect(ix,cy+13,16,7,P.gold);rect(ix,cy+9,2,4,P.gold);rect(ix+7,cy+8,2,5,P.gold);rect(ix+14,cy+9,2,4,P.gold);ix+=18;}
    if(p.market){rect(ix,cy+10,9,9,P.paper);rect(ix+2,cy+12,5,5,P.red);ix+=12;}
    if(p.mill){rect(ix+2,cy+8,3,12,P.road);rect(ix,cy+8,7,2,P.road);}
    const army=(p.soldiers+p.knights?p.soldiers+(p.knights?'+'+p.knights+'k':'')+(p.engines?'+'+p.engines+'e':''):'')+(p.levy?(p.soldiers+p.knights?' ':'')+'('+p.levy+')':'');
    text(army,cx,cy+24,p.owner===me()?P.white:P.paper,'center',SMALL);
    if(p.vassal)text('loyal '+p.lord.loyalty,cx,cy+38,p.lord.loyalty<=3?P.red:P.lgrey,'center',SMALL);
    else if(p.unrest>=3)text('unrest '+p.unrest,cx,cy+38,P.red,'center',SMALL);
    if(p.home&&p.owner===me())text('YOU',cx,cy-36,P.white,'center',SMALL);
  });
  // legend
  rect(6,508,290,86,P.ink);rect(8,510,286,82,P.grey);
  text('N gold = pays its owner each season.  8+1k (3) = men+knights (levy)',12,513,P.paper,'left','11px monospace');
  text('You are '+EARLNAMECOL[me()]+'. Hatching = a vassal lord. Rivals:',12,526,EARLCOL[me()][1],'left','11px monospace');
  for(let l=0,k=0;l<4;l++){if(l===me())continue;const L=G.lords[l];rect(12,542+k*15,9,9,EARLCOL[l][0]);text(L.name+' ('+EARLNAMECOL[l]+'): '+(G.alive[l]?Sim.count(G,l)+' lands, '+Sim.income(G,l)+' gold a season'+(G.allies[Sim.key(me(),l)]>G.turn?', ally':''):'gone'),26,540+k*15,P.paper,'left','11px monospace');k++;}
}
function targetable(p){
  if(U.mode==='march')return Sim.adj(U.sel,p.id);
  if(U.mode==='raid')return Sim.adj(U.sel,p.id)&&p.owner!==me();
  if(U.mode==='marry')return p.owner<0&&p.lord&&!p.lord.dispossessed&&p.lord.temper!=='city'&&Sim.neighbours(G,p.id).some(q=>q.owner===me());
  if(U.mode==='turn')return p.vassal&&p.owner>=0&&p.owner!==me();
  if(U.mode==='pardon')return p.owner===me()&&p.lord&&p.lord.dispossessed;
  return false;
}

function drawPanel(){
  const px=534;rect(520,24,280,576,P.grey);rect(524,28,272,568,P.ink);
  // who you are + hint
  face(px,34,32,me());text(G.lords[me()].name+', '+G.lords[me()].title,px+40,34,EARLCOL[me()][1],'left',SMALL);
  text('Renown '+G.lords[me()].renown,px+40,49,P.lgrey,'left',SMALL);button(px+206,34,44,20,'Help',()=>{U.help=true;},true);
  rect(px,72,250,1,P.grey);
  let y=wrap(hintText(),px,78,250,P.gold);
  if(U.flash&&frameN-U.flash.t<240){y=wrap(U.flash.s,px,y+2,250,U.flash.c);}
  y=Math.max(y,124);rect(px,y,250,1,P.grey);y+=6;
  const p=U.sel!==null?G.prov[U.sel]:null;
  if(!p){text('Click a province.',px,y,P.paper);return;}
  text(p.name,px,y,P.gold);y+=18;
  text(p.terrain+(p.feature?', '+p.feature:''),px,y,P.lgrey,'left',SMALL);y+=14;
  const who=p.owner<0?(p.lord?p.lord.name+' ('+p.lord.temper+')':'no lord'):G.lords[p.owner].name+(p.home?' (home)':p.vassal?', vassal':'');
  text(who,px,y,ownerCol(p,true),'left',SMALL);y+=14;
  if(p.vassal){text(p.lord.name+' ('+p.lord.temper+'), loyalty '+p.lord.loyalty,px,y,P.lgrey,'left',SMALL);y+=14;}
  else if(p.lord&&p.lord.dispossessed){text(p.lord.name+', dispossessed'+(p.lord.host>=0?', at '+G.lords[p.lord.host].name+'\'s court':''),px,y,P.red,'left',SMALL);y+=14;}
  text('Pays '+(p.owner>=0?Sim.provIncome(G,p):p.base)+' gold a season ('+(p.vassal?'vassal dues':p.tax===1?'fair tax':p.tax>1?'harsh tax':'low tax')+')',px,y,P.paper,'left',SMALL);y+=14;
  text('Men '+p.soldiers+'  Knights '+p.knights+'  Engines '+p.engines+'  Levy '+p.levy,px,y,P.paper,'left',SMALL);y+=14;
  text('Defends at '+Sim.strength(G,p,false)+(p.owner>=0&&!p.vassal?'  unrest '+p.unrest:''),px,y,P.lgrey,'left',SMALL);y+=18;
  if(!canAct(p)){
    if(p.owner!==me()){const b=Sim.neighbours(G,p.id).some(q=>q.owner===me());text(b?'On your border.':'Not on your border.',px,y,P.lgrey);y+=18;
      wrap(b?'To attack: click your province next to it, then click here.':'You can only march one province at a time. Take the land between first.',px,y,250,P.grey);}
    return;
  }
  const bw=250,bh=18,gold=G.gold[me()];
  if(U.mode==='march'){
    text('MARCH',px,y,P.gold);y+=18;
    y=wrap('Click a blinking neighbour. The next box lets you set how many go and shows the odds.',px,y,250,P.lgrey)+4;
    button(px,y,bw,bh,'Cancel',()=>{U.mode=null;});
    return;
  }
  // STEP 1: recruit and build
  text('1. RECRUIT AND BUILD',px,y,P.gold);text(gold+' gold',px+250,y,P.gold,'right');y+=18;
  if(p.vassal){y=wrap('A vassal lord rules here. You may station troops but not tax, recruit or build.',px,y,250,P.lgrey)+6;}
  else{
    if(!p.castle)y=wrap('No castle here, so no recruiting. Build one, or recruit where you have a castle.',px,y,250,P.lgrey)+2;
    const kc=Sim.season(G)==='Spring'?6:8,cc=p.feature==='quarry'?12:20;
    const needC='No castle here. Recruit where you have one.';
    button(px,y,122,bh,'Soldier 1 gold',()=>tryBuy(p,'soldier'),gold>=1&&p.castle,!p.castle?needC:'Not enough gold.');
    button(px+128,y,122,bh,'Knight '+kc+' gold',()=>tryBuy(p,'knight'),gold>=kc&&p.castle&&!G.knightBought,!p.castle?needC:G.knightBought?'One knight a season, already bought.':'Needs '+kc+' gold.');y+=22;
    button(px,y,122,bh,'Engine 15 gold',()=>tryBuy(p,'engine'),gold>=15&&p.castle,!p.castle?needC:'Needs 15 gold. Engines let you assault walls.');
    button(px+128,y,122,bh,p.castle?'Castle: built':'Castle '+cc+' gold',()=>tryBuy(p,'castle'),!p.castle&&gold>=cc,p.castle?'Already a castle here.':'Needs '+cc+' gold. A castle recruits and doubles defence.');y+=22;
    button(px,y,122,bh,p.mill?'Mill: built':'Mill 5 gold',()=>tryBuy(p,'mill'),!p.mill&&gold>=5,p.mill?'Already a mill: +1 gold a season, +2 in autumn.':'Needs 5 gold. +1 gold a season, +2 in autumn.');
    button(px+128,y,122,bh,p.market?'Market: held':'Market 12 gold',()=>tryBuy(p,'market'),!p.market&&gold>=12,p.market?'Already a market: +2 gold a season.':'Needs 12 gold. +2 gold a season, one per three provinces.');y+=20;
    button(px,y,bw,bh,'Tax here: '+(p.tax===1?'fair':p.tax>1?'harsh (more gold, unrest rises)':'low (less gold, unrest falls)'),()=>{p.tax=p.tax===0.5?1:p.tax===1?1.5:0.5;flash('Tax at '+p.name+' is now '+(p.tax===1?'fair':p.tax>1?'harsh':'low')+'.');});y+=24;
  }
  // STEP 2: march
  text('2. MARCH  (one a season)',px,y,P.gold);text(G.moved?'done':Sim.season(G)==='Winter'?'winter':'ready',px+250,y,G.moved?P.lgrey:P.white,'right');y+=18;
  if(G.moved)y=wrap('Marched this season. Next march: '+Sim.SEASONS[(G.turn+1)%4]+'.',px,y,250,P.lgrey)+2;
  else if(Sim.season(G)==='Winter')y=wrap('No marching in winter.',px,y,250,P.lgrey)+2;
  else y=wrap('Click a neighbour of '+p.name+' on the map, or:',px,y,250,P.lgrey)+2;
  button(px,y,130,bh,'Where can I march?',beginMarch,!G.moved&&Sim.season(G)!=='Winter'&&p.soldiers+p.knights>0,G.moved?'Already marched this season.':Sim.season(G)==='Winter'?'No marching in winter.':'No men here.');
  button(px+136,y,114,bh,'stance: '+Sim.STANCE[U.stance],()=>{U.stance=(U.stance+1)%3;flash(['Cautious: odds -10, losses halved, a loss is a retreat.','Steady: odds as shown.','Bold: odds +10, losses doubled on defeat.'][U.stance]);});y+=26;
  // STEP 3: deeds
  const dl=deedsLeft();text('3. DEEDS',px,y,P.gold);text(dl+' left',px+250,y,dl?P.white:P.lgrey,'right');y+=18;
  const bw3=80,gap=85;
  const md=(x,m,label,ok,why)=>button(px+x,y,bw3,bh,U.mode===m?'Target?':label,()=>{U.mode=U.mode===m?null:m;flash('Click a gold-outlined province.');},ok&&dl>0,dl<=0?'No deeds left this season.':why);
  md(0,'raid','Raid',p.knights>0,'A raid needs a knight in this province.');
  button(px+gap,y,bw3,bh,'Tourney',()=>{useDeed(Sim.tournament(G,me(),U.rival,U.stake,U.purse));flash(lastLog());},dl>0&&gold>=U.stake+U.purse,dl<=0?'No deeds left.':'Needs stake + purse in gold.');
  md(gap*2,'marry','Marry 15g',G.lords[me()].renown>=5&&gold>=15,'Needs renown 5 and 15 gold.');y+=20;
  button(px,y,bw3,bh,'v '+G.lords[U.rival].name.slice(0,6),()=>{do{U.rival=(U.rival+1)%4;}while(U.rival===me()||!G.alive[U.rival]);},true);
  button(px+gap,y,bw3,bh,'stake '+U.stake,()=>{U.stake=U.stake>=20?5:U.stake+5;},true);button(px+gap*2,y,bw3,bh,'purse '+U.purse,()=>{U.purse=U.purse>=15?0:U.purse+5;},true);y+=20;
  md(0,'turn','Turn',true,'');
  md(gap,'pardon','Pardon',G.prov.some(q=>q.owner===me()&&q.lord&&q.lord.dispossessed),'No dispossessed lord in your land.');
  button(px+gap*2,y,bw3,bh,'Ally',()=>{useDeed(Sim.ally(G,me(),U.rival));flash(lastLog());},dl>0,'No deeds left.');y+=20;
  button(px,y,bw,bh,'Draw a court card',()=>{useDeed(Sim.drawCard(G,me()));flash(lastLog());},dl>0,'No deeds left.');
  text('Raid, tourney, ally and marry use the rival and stakes set above.',px,y+20,P.grey,'left',SMALL);
}

function draw(){
  buttons=[];frameN++;rect(0,0,W,H,P.ink);
  if(U.phase==='choose'){
    box(60,50,680,500);
    text('IRONCROWN — the land and the gold',W/2,68,P.red,'center');
    text('Choose your earl. Twelve years to take London and the crown of England.',W/2,96,P.ink,'center');
    Sim.EARLS.forEach((e,i)=>{const x=90+i*165,y=130;rect(x,y,150,290,P.ink);rect(x+3,y+3,144,284,EARLCOL[i][0]);
      face(x+43,y+10,64,i);
      text(e.name,x+75,y+82,P.white,'center');text(e.title,x+75,y+100,P.paper,'center',SMALL);
      text('plays '+EARLNAMECOL[i],x+75,y+116,P.paper,'center',SMALL);
      ['Leadership '+e.lead,'Stewardship '+e.stew,'Cunning '+e.cun,'Renown '+e.renown].forEach((s,k)=>text(s,x+75,y+142+k*18,P.paper,'center',SMALL));
      text(i===0||i===1?'far corner, 2 lands':'near corner, 1 land',x+75,y+220,P.paper,'center',SMALL);
      button(x+25,y+250,100,24,'Play',()=>start(i),true);});
    ['Every province has a lord. March on a weak one and they may kneel and become your vassal.','Every fight shows points against points and the odds before you commit.',
     'One march and one deed a season. Winter freezes armies left outside walls.'].forEach((s,i)=>text(s,W/2,436+i*18,P.ink,'center',SMALL));
    button(300,500,200,22,U.skipAll?'Story scenes: off':'Story scenes: on',()=>setSkip(!U.skipAll),true);
    finish();return;
  }
  drawMap();
  rect(0,0,W,24,P.ink);
  rect(4,5,14,14,EARLCOL[me()][0]);text(G.lords[me()].name+' ('+EARLNAMECOL[me()]+')',24,5,EARLCOL[me()][1]);
  text(Sim.season(G)+', year '+Sim.year(G),170,5,P.paper);
  text('Treasury '+G.gold[me()]+' gold   Income '+Sim.income(G,me())+'/season   Land '+Sim.count(G,me())+'/18',330,5,P.gold);
  drawPanel();
  const px=534;
  rect(px,520,250,1,P.grey);
  const lines=G.log.slice(-3);lines.forEach((s,i)=>text(s.length>36?s.slice(0,35)+'…':s,px,524+i*15,i===lines.length-1?P.paper:P.grey,'left',SMALL));
  const endOn=U.phase==='play';
  button(px,570,250,24,(G.moved||Sim.season(G)==='Winter'?'END SEASON  (Enter)':'END SEASON (Enter), no march yet'),endSeason,endOn,'Finish what is open first.');
  if(endOn&&G.moved&&((frameN>>4)&1))rect(px,570,250,2,P.gold);

  if(U.phase==='confirm'){
    const c=U.confirm,A=G.prov[c.from],D=G.prov[c.to],pv=Sim.preview(G,c.from,c.to,U.moveN,U.stance);box(120,150,560,270);
    text(pv.own?'March to '+D.name:'Attack '+D.name,W/2,160,P.red,'center');
    button(150,192,30,22,'-',()=>{U.moveN=Math.max(0,U.moveN-1);},U.moveN>0);button(186,192,30,22,'+',()=>{U.moveN=Math.min(A.soldiers,U.moveN+1);},U.moveN<A.soldiers);
    text(U.moveN+' of '+A.soldiers+' men march'+(A.knights?', with '+A.knights+' knight'+(A.knights>1?'s':''):'')+(A.engines?' and an engine':'')+'. '+(A.soldiers-U.moveN)+' stay to hold '+A.name+'.',230,196,P.ink,'left',SMALL);
    button(150,220,100,18,'All but 2',()=>{U.moveN=Math.max(0,A.soldiers-2);},true);button(256,220,100,18,'Everyone',()=>{U.moveN=A.soldiers;},true);button(362,220,100,18,'Half',()=>{U.moveN=Math.floor(A.soldiers/2);},true);
    if(pv.own){text('Your own land. No battle, just a move.',W/2,250,P.ink,'center');}
    else{
      text('Your attack '+pv.as+'  v  their defence '+pv.ds,W/2,246,P.ink,'center');
      text((D.owner<0?(D.lord?D.lord.name+' ('+D.lord.temper+')':'levies'):G.lords[D.owner].name)+(D.castle?', behind walls':'')+(D.terrain==='hills'?', in the hills':D.terrain==='forest'?', in the forest':''),W/2,264,P.ink,'center',SMALL);
      const pct=Math.round(pv.odds*100);rect(200,282,400,18,P.grey);rect(200,282,400*pv.odds,18,pct>=60?P.gold:pct>=45?P.parch:P.red);text('Odds of victory '+pct+'%  ('+Sim.STANCE[U.stance]+')',W/2,284,P.ink,'center',SMALL);
      if(pv.mayKneel)text(D.lord.name+' will likely kneel rather than fight.',W/2,306,P.ink,'center',SMALL);
      else text('Lose, and you lose '+(U.stance===0?'a quarter':U.stance===2?'most':'half')+' of the men who marched.',W/2,306,P.ink,'center',SMALL);
    }
    button(160,336,140,26,'stance: '+Sim.STANCE[U.stance],()=>{U.stance=(U.stance+1)%3;},!pv.own);
    button(330,336,140,26,pv.own?'March':'Attack',doConfirm,true);
    button(500,336,140,26,'Cancel',()=>{U.phase='play';U.confirm=null;},true);
    text('Nothing has moved yet. One army marches each season.',W/2,380,P.grey,'center',SMALL);
  }
  if(U.phase==='offer'){
    const o=U.offer,D=G.prov[o.to];box(150,180,500,200);
    text(D.lord.name+' of '+D.name+' offers to kneel.',W/2,200,P.red,'center');
    text('Your '+o.as+' points against their '+o.ds+'.',W/2,232,P.ink,'center');
    text('Accept: they keep their seat as your vassal at loyalty 5.',W/2,254,P.ink,'center',SMALL);
    text('Their land pays you and their levy defends it.',W/2,270,P.ink,'center',SMALL);
    text('Refuse: battle, and conquest if you win.',W/2,286,P.ink,'center',SMALL);
    button(220,320,150,28,'Accept homage',()=>answerOffer(true),true);button(430,320,150,28,'Refuse, attack',()=>answerOffer(false),true);
  }
  if(U.phase==='scene'&&U.scenes.length){
    const sc=U.scenes[0];box(80,120,640,300);
    rect(100,140,120,150,P.ink);
    const ei=Sim.EARLS.findIndex(e=>e.name===sc.lord);if(ei>=0)face(104,144,112,ei);else{rect(104,144,112,142,P.parch);text(sc.initials||'?',160,196,P.ink,'center','bold 28px monospace');}
    text(sc.title,240,146,P.red);
    let yy=176;sc.lines.forEach(l=>{yy=wrap(l,240,yy,460,P.ink)+12;});
    text('Scene '+(U.sceneTotal-U.scenes.length+1)+' of '+U.sceneTotal+'. Click anywhere or press a key to continue.',W/2,346,P.grey,'center',SMALL);
    button(420,370,200,24,'Skip all scenes  (Esc)',()=>{setSkip(true);U.scenes=[];nextScene();},true);
  }
  if(U.phase==='turnplay'){
    const pl=U.play,st=pl.steps[pl.i];
    if(frameN-pl.t>(st.big?150:st.mine?70:40))advancePlay();
    if(U.phase==='turnplay'){
      const w=st.big?520:460;rect(W/2-w/2-4-140,470,w+8,58,P.ink);rect(W/2-w/2-140,474,w,50,st.big?P.gold:P.paper);
      wrap(st.text,W/2-w/2-134,480,w-12,P.ink,st.big?FONT:SMALL);
      text('click to hurry, Esc to skip',W/2-140,510,P.grey,'center',SMALL);
    }
  }
  if(U.phase==='over'){
    box(150,200,500,180);const o=G.over;
    const how={crown:'holds London and the crown',treasury:'commands the wealth of England',last:'is the last lord standing',time:'has the greatest income after twelve years'}[o.how]||'';
    text(o.l===me()?'YOU WEAR THE CROWN':o.l<0?'YOUR LINE IS ENDED':G.lords[o.l].name.toUpperCase()+' TAKES THE CROWN',W/2,220,P.red,'center');
    text(o.l>=0?G.lords[o.l].name+' '+how+'.':'You hold no land.',W/2,256,P.ink,'center');
    text('Year '+Sim.year(G)+'. Your income '+Sim.income(G,me())+' gold, land '+Sim.count(G,me())+'.',W/2,290,P.ink,'center');
    text('Seed #'+G.seed0.toString(16)+'. Reload to play again.',W/2,330,P.ink,'center');
  }
  if(U.help){
    box(60,40,680,520);text('HOW A SEASON WORKS',W/2,56,P.red,'center');
    ['Each season you may do three things, in any order, then END SEASON.','',
     '1. RECRUIT AND BUILD at any province of yours with a castle. Soldiers cost 1 gold,','   knights 8 (one a season), siege engines 15. A castle costs 20 and recruits.','   Tax harsh for more gold now; unrest rises and the province may revolt.','',
     '2. MARCH. One army marches once a season. Click your province, then a neighbour.','   You choose how many men go and see the odds before you attack. Knights and engines','   always go with the army. Whoever stays behind holds the province. A weak lord may','   kneel instead of fighting and become your vassal. Walls need a siege engine.','',
     '3. DEEDS. One a season (two from six provinces): raid a neighbour for gold, wager on','   a tournament, marry into a house, turn a rival\'s vassal, pardon a lord, draw a card.','',
     'Every province pays gold each season; autumn doubles it, winter halves it, no marching.','Win: hold London with a castle for a year with the highest income, or take 60% of all','income for a year, or be the last earl standing. Twelve years.','',
     'Keys: S soldier, K knight, C castle, M march, Enter end season, H help. Click to close.'].forEach((l,i)=>text(l,80,84+i*19,P.ink,'left',SMALL));
  }
  if(U.tutorial>=1&&U.tutorial<=2&&U.phase==='play'&&!U.help){
    const t=U.tutorial;box(20,300,480,120);
    const L=t===1?['HOW TO PLAY','You are '+G.lords[me()].name+'. Your land is '+EARLNAMECOL[me()]+' and marked YOU.','Click your home province to see what you can do there.','Take neighbours by marching on them; every province pays gold each season.']
      :['NOW RECRUIT AND MARCH','Step 1 on the right: buy soldiers, 1 gold each, here at your castle.','Step 2: click a neighbouring province on the map to march on it.','You choose how many go and see the odds first. Then END SEASON. Press H for help.'];
    L.forEach((s,i)=>text(s,30,308+i*22,i===0?P.red:P.ink,'left',i===0?FONT:SMALL));
    button(400,394,90,20,'Got it',()=>{U.tutorial=t===1?2:0;},true);
  }
  finish();
}
function finish(){let k=Math.min(innerWidth/W,innerHeight/H);if(k>=2)k=Math.floor(k);const cw=Math.round(W*k),ch=Math.round(H*k);if(cv.width!==cw){cv.width=cw;cv.height=ch;}ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,cw,ch);}
function frame(){draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
</body>
</html>
